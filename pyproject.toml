[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlens"
version = "0.1.0"
description = "AI-powered research assistant using RAG and Gemma 4"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Arupa Barua" }
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 88
ignore = [
    "E203",
    "W503"
]